name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - uses: dart-lang/setup-dart@v1

      - name: Setup FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: FVM Install Flutter
        run: fvm install

      - name: Install dependencies
        run: fvm flutter pub get

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build APK
        run: |
          # --split-per-abi: one APK per CPU arch (arm64 for the masjid TV)
          # instead of one fat 50MB+ APK bundling arm64 + arm32 + x86_64.
          # --obfuscate trims Dart code size on top of that.
          fvm flutter build apk --release --split-per-abi \
          --obfuscate --split-debug-info=build/debug-info \
          --build-name=${{ steps.get_version.outputs.VERSION }} \
          --build-number=${{ github.run_number }}

      - name: Get Latest Changelog
        id: changelog_reader
        run: |
          # Extract only the newest section: from the first "## " heading up to
          # the next one. The old `sed -n '/^##/,/^##/p'` restarted the range at
          # every later heading, so old sections leaked into the release body.
          # Drop the heading (the release title already shows the version) and
          # trim trailing blank lines.
          awk '
            /^## / { section++; if (section == 2) exit; next }
            section != 1 { next }
            !NF && !started { next }
            { started = 1; n++; lines[n] = $0; if (NF) last = n }
            END { for (i = 1; i <= last; i++) print lines[i] }
          ' CHANGELOG.md > release-notes.md

          {
            echo "content<<RELEASE_NOTES_EOF"
            cat release-notes.md
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body: ${{ steps.changelog_reader.outputs.content }}
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
